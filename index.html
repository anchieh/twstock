<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>台股收盤行情查詢</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --bg: #ffffff;
    --card-bg: #f5f5f5;
    --muted: #666;
    --border: #ddd;
    --up: #c0392b;
    --down: #1e8449;
    --accent: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #eee;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --muted: #999;
      --border: #333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .updated { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

  .indices { display: flex; gap: 10px; margin-bottom: 20px; }
  .index-card {
    flex: 1;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .index-card .name { font-size: 0.8rem; color: var(--muted); }
  .index-card .close { font-size: 1.2rem; font-weight: 700; margin: 2px 0; }
  .index-card .change { font-size: 0.85rem; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
  .tab {
    padding: 8px 12px;
    font-size: 0.9rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    user-select: none;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
    margin-bottom: 12px;
  }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:nth-child(-n+4), td:nth-child(-n+4) { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .market {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    font-size: 0.7rem;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
  }
  .star {
    cursor: pointer;
    font-size: 1rem;
    color: var(--muted);
    width: 22px;
    text-align: center;
  }
  .star.active { color: #f1c40f; }
  .empty, .status { color: var(--muted); text-align: center; padding: 24px 0; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--fg); }
  th .sort-arrow { color: var(--accent); margin-left: 2px; }
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 0 4px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .pagination button {
    padding: 6px 12px;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
  }
  .pagination button:disabled { opacity: 0.4; cursor: default; }
  .screener-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
  .screener-row label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.8rem;
    color: var(--muted);
    flex: 1;
    min-width: 120px;
  }
  .screener-row input[type="number"],
  .screener-row select {
    padding: 8px 10px;
    font-size: 0.95rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
  }
  .screener-note { color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
  .screener-count { color: var(--muted); font-size: 0.8rem; margin: 8px 0 4px; }
  .screener-checkbox { display: block; font-size: 0.9rem; margin-bottom: 10px; }
  .screener-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .screener-presets button {
    padding: 7px 14px;
    font-size: 0.85rem;
    border: 1px solid var(--accent);
    border-radius: 999px;
    background: var(--bg);
    color: var(--accent);
    cursor: pointer;
  }
  .screener-presets button:hover { background: var(--accent); color: #fff; }
  .hint { font-weight: 400; opacity: 0.75; }
  .label-head { display: block; min-height: 2.4em; line-height: 1.2; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>台股收盤行情查詢</h1>
    <div class="updated" id="updated">載入中...</div>
    <div class="indices" id="indices"></div>

    <div class="tabs">
      <div class="tab active" data-tab="search">搜尋</div>
      <div class="tab" data-tab="gainers">漲幅排行</div>
      <div class="tab" data-tab="losers">跌幅排行</div>
      <div class="tab" data-tab="volume">成交量排行</div>
      <div class="tab" data-tab="watchlist">自選股</div>
      <div class="tab" data-tab="screener">低估股篩選</div>
    </div>

    <div id="search-pane">
      <input type="text" id="search" placeholder="輸入股票代號或名稱,例如 2330 或 台積電" autocomplete="off" />
    </div>

    <div id="screener-pane">
      <div class="screener-presets" id="screener-presets"></div>
      <div class="screener-row">
        <label><span class="label-head">本益比上限 <span class="hint">(低為佳)</span></span><input type="number" id="screener-pe" step="0.1" /></label>
        <label><span class="label-head">股價淨值比上限 <span class="hint">(低為佳)</span></span><input type="number" id="screener-pb" step="0.1" /></label>
        <label><span class="label-head">殖利率下限(%) <span class="hint">(高為佳)</span></span><input type="number" id="screener-yield" step="0.1" /></label>
      </div>
      <div class="screener-row">
        <label><span class="label-head">本金(元) <span class="hint">(抓滿一張股票,股價上限會自動算)</span></span><input type="number" id="screener-budget" step="1000" min="0" placeholder="例如 20000" /></label>
        <label><span class="label-head">股價下限(元)</span><input type="number" id="screener-price-min" step="1" placeholder="留空不限制" /></label>
        <label><span class="label-head">股價上限(元) <span class="hint">(可手動覆蓋本金算出來的值)</span></span><input type="number" id="screener-price-max" step="1" placeholder="留空不限制" /></label>
      </div>
      <div class="screener-row">
        <label><span class="label-head">成交量下限(股)</span><input type="number" id="screener-volume" step="1000" placeholder="留空不限制" /></label>
        <label><span class="label-head">日內振幅下限(%) <span class="hint">(要夠大才有操作空間)</span></span><input type="number" id="screener-volatility-min" step="0.5" min="0" placeholder="留空不限制" /></label>
        <label><span class="label-head">日內振幅上限(%) <span class="hint">(避免過度暴衝的極端股)</span></span><input type="number" id="screener-volatility-max" step="0.5" min="0" placeholder="留空不限制" /></label>
      </div>
      <div class="screener-row">
        <label><span class="label-head">連續獲利年數下限</span><input type="number" id="screener-years" step="1" min="0" placeholder="留空不限制" /></label>
        <label><span class="label-head">6日乖離率絕對值下限(%) <span class="hint">(要夠大才有乖離可以套)</span></span><input type="number" id="screener-bias-min" step="0.5" min="0" placeholder="留空不限制" /></label>
        <label><span class="label-head">市場別</span>
          <select id="screener-market">
            <option value="">全部</option>
            <option value="TWSE">只看上市</option>
            <option value="TPEx">只看上櫃</option>
          </select>
        </label>
      </div>
      <div class="screener-row">
        <label><span class="label-head">產業別</span>
          <select id="screener-industry">
            <option value="">全部</option>
          </select>
        </label>
      </div>
      <label class="screener-checkbox"><input type="checkbox" id="screener-profitable" checked /> <span id="screener-profitable-label">只看累計有獲利的公司(EPS &gt; 0)</span></label>
      <label class="screener-checkbox"><input type="checkbox" id="screener-exclude-etf" /> 排除 ETF/受益憑證(代號 00 開頭,含槓桿、反向商品)</label>
      <div class="screener-note" id="screener-note"></div>
      <input type="text" id="screener-search" placeholder="在篩選結果中搜尋代號或名稱(選填),例如 2303 或 聯電" autocomplete="off" />
      <div class="screener-count" id="screener-count"></div>
    </div>

    <div id="result"></div>
  </div>

<script>
const DATA_URL = "data/stock_day_all.json";
const WATCHLIST_KEY = "twstock-watchlist";
let quotes = [];
let marketAverages = {};

// 「ticket」= 一組寫死的篩選參數組合,按一下按鈕就把 screener-pane 裡所有欄位設成這組值。
// 要新增自己的 ticket,照這個格式加一筆進陣列就好:
//   name: 按鈕上顯示的名字
//   fields: screener-pane 裡各 <input>/<select> 的 id -> 要填入的值,留空字串代表「不限制」
//   profitable: 「只看累計有獲利」勾選框要不要打勾
// fields 也可以是函式(取得 marketAverages 之類的即時資料時用),回傳值物件。
const SCREENER_PRESETS = [
  {
    name: "低估價值股(預設)",
    fields: () => ({
      "screener-pe": marketAverages.p25PERatio ?? "",
      "screener-pb": 0.8,
      "screener-yield": marketAverages.p75DividendYield ?? "",
      "screener-budget": "",
      "screener-price-min": "",
      "screener-price-max": "",
      "screener-volume": "",
      "screener-volatility-min": "",
      "screener-volatility-max": "",
      "screener-years": "",
      "screener-bias-min": "",
      "screener-market": "",
      "screener-industry": "",
    }),
    profitable: true,
    excludeEtf: false,
  },
  {
    name: "短線小資(2萬本金,要有波動空間)",
    fields: {
      "screener-pe": "",
      "screener-pb": "",
      "screener-yield": "",
      "screener-budget": 20000,
      "screener-price-min": 10,
      "screener-price-max": 20,
      "screener-volume": 10000000,
      "screener-volatility-min": 2,
      "screener-volatility-max": 8,
      "screener-years": "",
      "screener-bias-min": "",
      "screener-market": "",
      "screener-industry": "",
    },
    excludeEtf: true,
    profitable: false,
  },
];

function applyScreenerPreset(preset) {
  const fields = typeof preset.fields === "function" ? preset.fields() : preset.fields;
  Object.entries(fields).forEach(([id, value]) => {
    document.getElementById(id).value = value;
  });
  document.getElementById("screener-profitable").checked = preset.profitable;
  document.getElementById("screener-exclude-etf").checked = !!preset.excludeEtf;
  renderActiveTab();
}

function renderScreenerPresets() {
  const el = document.getElementById("screener-presets");
  el.innerHTML = SCREENER_PRESETS.map((p, i) => `<button type="button" data-index="${i}">${p.name}</button>`).join("");
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => applyScreenerPreset(SCREENER_PRESETS[Number(btn.dataset.index)]));
  });
}
let activeTab = "search";

function loadWatchlist() {
  try {
    return JSON.parse(localStorage.getItem(WATCHLIST_KEY) || "[]");
  } catch (e) {
    return [];
  }
}

function saveWatchlist(list) {
  try {
    localStorage.setItem(WATCHLIST_KEY, JSON.stringify(list));
  } catch (e) {
    // 瀏覽器封鎖儲存時靜默略過,不影響其他功能
  }
}

function toggleWatchlist(code, name) {
  const list = loadWatchlist();
  const idx = list.indexOf(code);
  if (idx >= 0) {
    if (!confirm(`要把「${name}」從自選股移除嗎?`)) return;
    list.splice(idx, 1);
  } else {
    list.push(code);
  }
  saveWatchlist(list);
  renderActiveTab();
}

function rocToIso(roc) {
  const year = parseInt(roc.slice(0, -4), 10) + 1911;
  return `${year}-${roc.slice(-4, -2)}-${roc.slice(-2)}`;
}

function percentChange(r) {
  const close = parseFloat(r.ClosingPrice);
  const change = parseFloat(r.Change);
  if (isNaN(close) || isNaN(change)) return null;
  const prevClose = close - change;
  if (!prevClose) return null;
  return (change / prevClose) * 100;
}

function intradayVolatility(r) {
  const high = parseFloat(r.HighestPrice);
  const low = parseFloat(r.LowestPrice);
  const close = parseFloat(r.ClosingPrice);
  if (isNaN(high) || isNaN(low) || !close) return null;
  return ((high - low) / close) * 100;
}

const PAGE_SIZE = 25;
const COLUMNS = [
  { label: "", sortable: false },
  { key: "code", label: "代號", accessor: r => r.Code },
  { key: "name", label: "名稱", accessor: r => r.Name },
  { key: "industry", label: "產業別", accessor: r => r.Industry || "" },
  { key: "open", label: "開盤", accessor: r => parseFloat(r.OpeningPrice) },
  { key: "high", label: "最高", accessor: r => parseFloat(r.HighestPrice) },
  { key: "low", label: "最低", accessor: r => parseFloat(r.LowestPrice) },
  { key: "close", label: "收盤", accessor: r => parseFloat(r.ClosingPrice) },
  { key: "change", label: "漲跌", accessor: r => percentChange(r) ?? parseFloat(r.Change) },
  { key: "volume", label: "成交量", accessor: r => Number(r.TradeVolume) || 0 },
  { key: "volatility", label: "日內振幅", accessor: r => intradayVolatility(r) },
  { key: "pe", label: "本益比", accessor: r => parseFloat(r.PERatio) },
  { key: "pb", label: "淨值比", accessor: r => parseFloat(r.PBRatio) },
  { key: "yield", label: "殖利率", accessor: r => parseFloat(r.DividendYield) },
  { key: "eps", label: "累計EPS", accessor: r => parseFloat(r.EPS) },
  { key: "years", label: "連續獲利年數", accessor: r => r.ConsecutiveProfitableYears || 0 },
  { key: "bias6", label: "6日乖離率", accessor: r => r.Bias6 },
];

let tableRows = [];
let tableSort = null; // { key, dir: 1 | -1 }
let tablePage = 1;

function compareValues(a, b) {
  const aMissing = a === undefined || a === null || (typeof a === "number" && isNaN(a));
  const bMissing = b === undefined || b === null || (typeof b === "number" && isNaN(b));
  if (aMissing && bMissing) return 0;
  if (aMissing) return 1;
  if (bMissing) return -1;
  if (typeof a === "string") return a.localeCompare(b, "zh-Hant");
  return a - b;
}

function setTableRows(rows) {
  tableRows = rows;
  tableSort = null;
  tablePage = 1;
  renderCurrentTable();
}

function sortedTableRows() {
  if (!tableSort) return tableRows;
  const col = COLUMNS.find(c => c.key === tableSort.key);
  return [...tableRows].sort((a, b) => tableSort.dir * compareValues(col.accessor(a), col.accessor(b)));
}

function renderCurrentTable() {
  const result = document.getElementById("result");
  if (tableRows.length === 0) {
    result.innerHTML = '<div class="empty">沒有符合的股票</div>';
    return;
  }
  const rows = sortedTableRows();
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  tablePage = Math.min(Math.max(1, tablePage), totalPages);
  const pageRows = rows.slice((tablePage - 1) * PAGE_SIZE, tablePage * PAGE_SIZE);

  const watchlist = loadWatchlist();
  const body = pageRows.map(r => {
    const change = parseFloat(r.Change);
    const cls = change > 0 ? "up" : change < 0 ? "down" : "";
    const sign = change > 0 ? "+" : "";
    const pct = percentChange(r);
    const pctText = pct === null ? "" : ` (${pct > 0 ? "+" : ""}${pct.toFixed(2)}%)`;
    const starred = watchlist.includes(r.Code);
    return `<tr>
      <td class="star ${starred ? "active" : ""}" data-code="${r.Code}" data-name="${r.Name}">${starred ? "★" : "☆"}</td>
      <td>${r.Code}</td>
      <td>${r.Name}<span class="market">${r.Market === "TPEx" ? "上櫃" : "上市"}</span></td>
      <td>${r.Industry || "-"}</td>
      <td>${r.OpeningPrice}</td>
      <td>${r.HighestPrice}</td>
      <td>${r.LowestPrice}</td>
      <td>${r.ClosingPrice}</td>
      <td class="${cls}">${sign}${r.Change}${pctText}</td>
      <td>${r.TradeVolume ? Number(r.TradeVolume).toLocaleString() : ""}</td>
      <td>${intradayVolatility(r) !== null ? intradayVolatility(r).toFixed(2) + "%" : "-"}</td>
      <td>${r.PERatio || "-"}</td>
      <td>${r.PBRatio || "-"}</td>
      <td>${r.DividendYield ? r.DividendYield + "%" : "-"}</td>
      <td class="${r.EPS !== undefined && parseFloat(r.EPS) < 0 ? "down" : ""}">${r.EPS !== undefined ? r.EPS : "-"}</td>
      <td>${r.ConsecutiveProfitableYears ? r.ConsecutiveProfitableYears + " 年" : "累積中"}</td>
      <td class="${r.Bias6 > 0 ? "up" : r.Bias6 < 0 ? "down" : ""}">${r.Bias6 !== undefined ? (r.Bias6 > 0 ? "+" : "") + r.Bias6 + "%" : "累積中"}</td>
    </tr>`;
  }).join("");

  const headerCells = COLUMNS.map(col => {
    if (!col.key) return "<th></th>";
    const arrow = tableSort && tableSort.key === col.key ? `<span class="sort-arrow">${tableSort.dir > 0 ? "▲" : "▼"}</span>` : "";
    return `<th class="sortable" data-key="${col.key}">${col.label}${arrow}</th>`;
  }).join("");

  result.innerHTML = `<div class="table-wrap"><table>
    <thead><tr>${headerCells}</tr></thead>
    <tbody>${body}</tbody>
  </table></div>
  <div class="pagination">
    <button id="page-prev" ${tablePage <= 1 ? "disabled" : ""}>上一頁</button>
    <span>第 ${tablePage} / ${totalPages} 頁(共 ${rows.length} 筆)</span>
    <button id="page-next" ${tablePage >= totalPages ? "disabled" : ""}>下一頁</button>
  </div>`;

  result.querySelectorAll(".star").forEach(el => {
    el.addEventListener("click", () => toggleWatchlist(el.dataset.code, el.dataset.name));
  });
  result.querySelectorAll("th.sortable").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.key;
      if (tableSort && tableSort.key === key) {
        tableSort.dir *= -1;
      } else {
        tableSort = { key, dir: 1 };
      }
      tablePage = 1;
      renderCurrentTable();
    });
  });
  const prevBtn = document.getElementById("page-prev");
  const nextBtn = document.getElementById("page-next");
  if (prevBtn) prevBtn.addEventListener("click", () => { tablePage -= 1; renderCurrentTable(); });
  if (nextBtn) nextBtn.addEventListener("click", () => { tablePage += 1; renderCurrentTable(); });
}

function renderTable(rows) {
  setTableRows(rows);
}

function tradableQuotes() {
  return quotes.filter(r => r.ClosingPrice && r.TradeVolume && Number(r.TradeVolume) > 0);
}

function screenerFilter() {
  const maxPE = parseFloat(document.getElementById("screener-pe").value);
  const maxPB = parseFloat(document.getElementById("screener-pb").value);
  const minYield = parseFloat(document.getElementById("screener-yield").value);
  const minVolume = parseFloat(document.getElementById("screener-volume").value);
  const minYears = parseFloat(document.getElementById("screener-years").value);
  const market = document.getElementById("screener-market").value;
  const minPrice = parseFloat(document.getElementById("screener-price-min").value);
  const maxPrice = parseFloat(document.getElementById("screener-price-max").value);
  const minVolatility = parseFloat(document.getElementById("screener-volatility-min").value);
  const maxVolatility = parseFloat(document.getElementById("screener-volatility-max").value);
  const minBias = parseFloat(document.getElementById("screener-bias-min").value);
  const industry = document.getElementById("screener-industry").value;

  return tradableQuotes().filter(r => {
    const pe = parseFloat(r.PERatio);
    const pb = parseFloat(r.PBRatio);
    const yieldPct = parseFloat(r.DividendYield);
    const price = parseFloat(r.ClosingPrice);
    if (!isNaN(minPrice)) {
      if (isNaN(price) || price < minPrice) return false;
    }
    if (!isNaN(maxPrice)) {
      if (isNaN(price) || price > maxPrice) return false;
    }
    if (!isNaN(minVolatility) || !isNaN(maxVolatility)) {
      const volatility = intradayVolatility(r);
      if (volatility === null) return false;
      if (!isNaN(minVolatility) && volatility < minVolatility) return false;
      if (!isNaN(maxVolatility) && volatility > maxVolatility) return false;
    }
    if (document.getElementById("screener-exclude-etf").checked && r.Code.startsWith("00")) {
      return false;
    }
    if (!isNaN(minBias)) {
      if (r.Bias6 === undefined || Math.abs(r.Bias6) < minBias) return false;
    }
    if (!isNaN(maxPE)) {
      if (isNaN(pe) || pe <= 0 || pe > maxPE) return false;
    }
    if (!isNaN(maxPB)) {
      if (isNaN(pb) || pb <= 0 || pb > maxPB) return false;
    }
    if (!isNaN(minYield)) {
      if (isNaN(yieldPct) || yieldPct < minYield) return false;
    }
    if (!isNaN(minVolume)) {
      if (Number(r.TradeVolume) < minVolume) return false;
    }
    if (!isNaN(minYears)) {
      if ((r.ConsecutiveProfitableYears || 0) < minYears) return false;
    }
    if (market && r.Market !== market) return false;
    if (industry && r.Industry !== industry) return false;
    if (document.getElementById("screener-profitable").checked) {
      const eps = parseFloat(r.EPS);
      if (isNaN(eps) || eps <= 0) return false;
    }
    return true;
  }).sort((a, b) => parseFloat(a.PERatio) - parseFloat(b.PERatio));
}

function renderActiveTab() {
  const searchPane = document.getElementById("search-pane");
  searchPane.style.display = activeTab === "search" ? "block" : "none";
  const screenerPane = document.getElementById("screener-pane");
  screenerPane.style.display = activeTab === "screener" ? "block" : "none";

  if (activeTab === "search") {
    search(document.getElementById("search").value);
  } else if (activeTab === "gainers" || activeTab === "losers") {
    const ranked = tradableQuotes()
      .map(r => ({ r, pct: percentChange(r) }))
      .filter(x => x.pct !== null)
      .sort((a, b) => activeTab === "gainers" ? b.pct - a.pct : a.pct - b.pct)
      .map(x => x.r);
    renderTable(ranked);
  } else if (activeTab === "volume") {
    const ranked = tradableQuotes()
      .sort((a, b) => Number(b.TradeVolume) - Number(a.TradeVolume));
    renderTable(ranked);
  } else if (activeTab === "watchlist") {
    const watchlist = loadWatchlist();
    const rows = quotes.filter(r => watchlist.includes(r.Code));
    renderTable(rows);
  } else if (activeTab === "screener") {
    const matched = screenerFilter();
    const kw = document.getElementById("screener-search").value.trim().toLowerCase();
    const filtered = kw
      ? matched.filter(r => r.Code.toLowerCase().includes(kw) || r.Name.toLowerCase().includes(kw))
      : matched;
    const countEl = document.getElementById("screener-count");
    countEl.textContent = kw
      ? `符合篩選條件共 ${matched.length} 檔,搜尋「${kw}」後剩 ${filtered.length} 檔`
      : `符合篩選條件共 ${matched.length} 檔,預設按本益比由低到高排序,點表格標題可改排序方式`;
    renderTable(filtered);
  }
}

function search(keyword) {
  const kw = keyword.trim().toLowerCase();
  if (!kw) {
    document.getElementById("result").innerHTML = '<div class="status">輸入股票代號或名稱開始查詢</div>';
    return;
  }
  const matched = quotes.filter(r =>
    r.Code.toLowerCase().includes(kw) || r.Name.toLowerCase().includes(kw)
  );
  renderTable(matched);
}

document.getElementById("search").addEventListener("input", e => search(e.target.value));

["screener-pe", "screener-pb", "screener-yield", "screener-price-min", "screener-price-max", "screener-volume", "screener-volatility-min", "screener-volatility-max", "screener-years", "screener-bias-min", "screener-market", "screener-industry", "screener-profitable", "screener-exclude-etf", "screener-search"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    if (activeTab === "screener") renderActiveTab();
  });
});

document.getElementById("screener-budget").addEventListener("input", e => {
  const budget = parseFloat(e.target.value);
  // 台股一張是 1000 股,本金除以 1000 就是買滿一張能接受的股價上限
  document.getElementById("screener-price-max").value = isNaN(budget) ? "" : Math.floor(budget / 1000);
  if (activeTab === "screener") renderActiveTab();
});

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    activeTab = tab.dataset.tab;
    renderActiveTab();
  });
});

function renderIndices(indices) {
  const el = document.getElementById("indices");
  el.innerHTML = (indices || []).map(idx => {
    const change = parseFloat(idx.change);
    const cls = change > 0 ? "up" : change < 0 ? "down" : "";
    const sign = change > 0 ? "+" : "";
    const pctSign = parseFloat(idx.changePercent) > 0 ? "+" : "";
    return `<div class="index-card">
      <div class="name">${idx.name}</div>
      <div class="close">${idx.close}</div>
      <div class="change ${cls}">${sign}${idx.change}(${pctSign}${idx.changePercent}%)</div>
    </div>`;
  }).join("");
}

fetch(DATA_URL)
  .then(res => res.json())
  .then(data => {
    quotes = data.quotes;
    const latestDate = quotes[0] ? rocToIso(quotes[0].Date) : "-";
    document.getElementById("updated").textContent =
      `資料日期: ${latestDate}(來源: TWSE / TPEx 官方 OpenAPI,更新於 ${data.updated_at}）`;
    renderIndices(data.indices);

    marketAverages = data.marketAverages || {};
    const avg = marketAverages;
    document.getElementById("screener-pe").value = avg.p25PERatio ?? "";
    document.getElementById("screener-pb").value = 0.8;
    document.getElementById("screener-yield").value = avg.p75DividendYield ?? "";

    const industries = [...new Set(quotes.map(r => r.Industry).filter(Boolean))].sort((a, b) => a.localeCompare(b, "zh-Hant"));
    const industrySelect = document.getElementById("screener-industry");
    industrySelect.innerHTML = '<option value="">全部</option>' +
      industries.map(name => `<option value="${name}">${name}</option>`).join("");

    renderScreenerPresets();
    const epsSample = quotes.find(r => r.EPSYear && r.EPSQuarter);
    const epsPeriod = epsSample ? `${parseInt(epsSample.EPSYear, 10) + 1911}年第${epsSample.EPSQuarter}季累計` : "最新一季累計";
    document.getElementById("screener-profitable-label").textContent =
      `只看${epsPeriod}有獲利的公司(EPS > 0,注意:年度還沒結束,這不是全年獲利保證)`;
    document.getElementById("screener-note").textContent =
      `預設門檻改用比較嚴格的四分位數,不是中位數:本益比 ≤ 全市場後 25%(${avg.p25PERatio ?? "-"}),股價淨值比 ≤ 0.8,殖利率 ≥ 全市場前 25%(${avg.p75DividendYield ?? "-"}%)。不同產業的合理本益比落差很大(例如金融股跟半導體股不能用同一把尺),如果篩出來的公司產業太雜,建議搭配上面的「產業別」欄位鎖定單一產業再比較。可自行調整,留空代表不限制這項。EPS 為公開資訊觀測站揭露的${epsPeriod}每股盈餘,部分剛掛牌或資料延遲的公司可能還沒有這季的數字。「連續獲利年數」從這次開始每季自動累積官方年度財報數字,目前還沒有完整年度資料,會顯示「累積中」,要等到有完整年度資料後才會顯示實際年數。「6日乖離率」是從今天開始每天累積收盤價算的,要連續累積滿 6 個交易日才會有數字,之前都會顯示「累積中」。`;

    renderActiveTab();
  })
  .catch(() => {
    document.getElementById("updated").textContent = "資料載入失敗";
  });
</script>
